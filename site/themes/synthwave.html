//
// Agent output nudges the grid's glow; a papaya-say message races down a grid
// line; a cue flares the sun.

  setup(s) {
    s.state.flare = 0
    s.state.pulse = 0
    s.state.racers = []
  },

  on(s, ev) {
    const st = s.state
